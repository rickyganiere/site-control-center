name: Daily performance scan

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/pagespeed.mjs'
      - '.github/workflows/performance-scan.yml'

permissions:
  contents: write

concurrency:
  group: site-performance-writes
  cancel-in-progress: false

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PageSpeed / Lighthouse checks
        run: node scripts/pagespeed.mjs
      - name: Save performance snapshot
        run: |
          if git diff --quiet -- data/performance.json; then
            echo "No changes"
            exit 0
          fi
          cp data/performance.json /tmp/performance.json
          git config user.name "site-control-bot"
          git config user.email "site-control-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/performance.json data/performance.json
          if git diff --quiet -- data/performance.json; then
            echo "No changes after refresh"
            exit 0
          fi
          git add data/performance.json
          git commit -m "chore: update performance snapshot"
          git push origin HEAD:main
