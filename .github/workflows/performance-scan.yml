name: Daily performance scan

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/pagespeed.mjs'
      - 'scripts/publish-snapshot.mjs'
      - '.github/workflows/performance-scan.yml'

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PageSpeed / Lighthouse checks
        run: node scripts/pagespeed.mjs
      - name: Publish snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-snapshot.mjs data/performance.json "chore: update performance snapshot"
