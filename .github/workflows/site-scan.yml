name: Site health scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/scan.mjs'
      - '.github/workflows/site-scan.yml'

permissions:
  contents: write

concurrency:
  group: site-health-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan sites
        run: node scripts/scan.mjs
      - name: Save latest snapshot
        run: |
          if git diff --quiet -- data/status.json; then
            echo "No changes"
            exit 0
          fi
          cp data/status.json /tmp/status.json
          git config user.name "site-control-bot"
          git config user.email "site-control-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/status.json data/status.json
            if git diff --quiet -- data/status.json; then
              echo "No changes after refresh"
              exit 0
            fi
            git add data/status.json
            git commit -m "chore: update site health snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
          done
          echo "Could not save snapshot after 3 attempts"
          exit 1
