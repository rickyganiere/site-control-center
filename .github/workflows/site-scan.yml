name: Site health scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/scan.mjs'
      - 'scripts/publish-snapshot.mjs'
      - '.github/workflows/site-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan sites
        run: node scripts/scan.mjs
      - name: Publish snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-snapshot.mjs data/status.json "chore: update site health snapshot"
