name: Site health scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan sites
        run: node scripts/scan.mjs
      - name: Save latest snapshot
        run: |
          if git diff --quiet -- data/status.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "site-control-bot"
          git config user.email "site-control-bot@users.noreply.github.com"
          git add data/status.json
          git commit -m "chore: update site health snapshot"
          git push
