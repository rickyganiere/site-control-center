name: Daily broken link scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/links.mjs'
      - 'scripts/publish-snapshot.mjs'
      - '.github/workflows/link-scan.yml'

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check internal links
        run: node scripts/links.mjs
      - name: Publish snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-snapshot.mjs data/links.json "chore: update broken link snapshot"
