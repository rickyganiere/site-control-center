name: GitHub status scan

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/github-status.mjs'
      - 'scripts/publish-snapshot.mjs'
      - '.github/workflows/github-status.yml'

permissions:
  contents: write
  actions: read

jobs:
  github-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_PUBLIC_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check GitHub workflows
        run: node scripts/github-status.mjs
      - name: Publish snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-snapshot.mjs data/deployments.json "chore: update GitHub status snapshot"
