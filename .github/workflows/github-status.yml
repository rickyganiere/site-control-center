name: GitHub status scan

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/github-status.mjs'
      - '.github/workflows/github-status.yml'

permissions:
  contents: write

concurrency:
  group: site-control-writes
  cancel-in-progress: false

jobs:
  github-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_MONITOR_TOKEN: ${{ secrets.GITHUB_MONITOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check GitHub workflows
        run: node scripts/github-status.mjs
      - name: Save GitHub status snapshot
        run: |
          if git diff --quiet -- data/deployments.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "site-control-bot"
          git config user.email "site-control-bot@users.noreply.github.com"
          git add data/deployments.json
          git commit -m "chore: update GitHub status snapshot"
          git pull --rebase origin main
          git push
