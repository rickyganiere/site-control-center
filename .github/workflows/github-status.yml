name: GitHub status scan

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: ['main']
    paths:
      - 'config/sites.json'
      - 'scripts/github-status.mjs'
      - '.github/workflows/github-status.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: site-github-writes
  cancel-in-progress: false

jobs:
  github-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_PUBLIC_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check GitHub workflows
        run: node scripts/github-status.mjs
      - name: Save GitHub status snapshot
        run: |
          if git diff --quiet -- data/deployments.json; then
            echo "No changes"
            exit 0
          fi
          cp data/deployments.json /tmp/deployments.json
          git config user.name "site-control-bot"
          git config user.email "site-control-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/deployments.json data/deployments.json
            if git diff --quiet -- data/deployments.json; then
              echo "No changes after refresh"
              exit 0
            fi
            git add data/deployments.json
            git commit -m "chore: update GitHub status snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
          done
          echo "Could not save snapshot after 3 attempts"
          exit 1
